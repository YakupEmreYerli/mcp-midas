name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm ci: kilit dosyasına birebir uyar. Kilitsiz ya da gevşek kurulum
      # tekrarlanabilir derleme üretmez.
      - run: npm ci
      - run: npm run build
      - run: npm test
