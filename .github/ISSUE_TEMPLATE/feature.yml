name: Feature request
description: Suggest a new tool, option or change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Changes that loosen or skip the order approval window are not accepted. See [CONTRIBUTING.md](https://github.com/YakupEmreYerli/mcp-midas/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: Describe the task, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
      description: If it uses a part of the Midas web app the server does not use yet, say which screen.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a pull request for this?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No"
